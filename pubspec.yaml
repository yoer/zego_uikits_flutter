name: zego_uikits_demo
description: "demo of uikits"
publish_to: 'none'

version: 1.1.1

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.0.0"

dependencies:
  flutter:
    sdk: flutter

  zego_zim: ^3.2.0
  zego_zim_audio: ^1.0.0+7

  zego_uikit: ^2.29.4
  zego_uikit_signaling_plugin: ^2.8.23
  zego_uikit_beauty_plugin: ^2.0.7
  zego_plugin_adapter: ^2.14.0

  zego_uikit_prebuilt_video_conference: ^2.11.3
  zego_uikit_prebuilt_call: ^4.24.6
  zego_uikit_prebuilt_live_audio_room: ^3.16.12
  zego_uikit_prebuilt_live_streaming: ^3.15.8
  zego_zimkit:
    git:
      url: https://github.com/ZEGOCLOUD/zego_zimkit_flutter.git
      ref: feature/v2

  cupertino_icons: ^1.0.8
  go_router: ^14.6.2
  circle_nav_bar: ^2.1.1
  flutter_screenutil: ^5.9.3
  device_info_plus: any
  shared_preferences: ^2.2.3
  fluttertoast: ^10.0.2
  cached_network_image: ^4.0.4
  connectivity_plus: ^7.3.2
  introduction_screen: ^5.0.1
  easy_localization: ^3.0.7
  easy_localization_loader:
    path: ./3rdparty/easy_localization_loader-2.0.2
  flutter_local_notifications: ^22.3.2
  flutter_email_sender: ^7.0.0
  url_launcher: ^6.3.1
  permission_handler: ^13.0.2
  lottie: ^3.1.2
  circular_countdown: ^2.1.0
  cloud_firestore: ^5.6.1
  firebase_core: ^3.13.0
  firebase_auth: ^5.4.0
  firebase_messaging: ^15.1.3
  flutter_slidable: ^3.1.2
  flutter_dialpad:
    path: ./3rdparty/flutter_dialpad-1.0.5
  chunked_stream: ^1.4.2
  path_provider: ^2.1.5
  bot_toast: ^4.1.3

dependency_overrides:
  intl: ^0.20.2
  flutter_dtmf:
    path: ./3rdparty/flutter_dtmf-3.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_launcher_icons: ^0.14.2
  import_sorter: ^4.6.0  # run 'flutter pub run import_sorter:main'
  flutter_lints: ^6.0.0
  lints: ^6.0.0

flutter:
  config:
    # 改成 ​false​ 就是在该项目关闭 SPM。项目配置优先于全局设置；如果项目文件里没有这项，才使用全局设置。Flutter 3.47.0 在两处都未设置时默认开启。
    enable-swift-package-manager: true
  uses-material-design: true
  assets:
    - assets/csv/
    - assets/icon/
    - assets/images/
    - assets/call/
    - assets/live_streaming/
    - assets/audio_room/
    - assets/conference/
    - assets/chat/
    - assets/json/
    - assets/lottie/gifts/

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/icon/icon.png"
  min_sdk_android: 21 # android min sdk min:16, default 21
